  - "src/client/components/onboarding/review/{ReviewWorkspace.tsx,ReviewClassificationPanel.tsx,ReviewDrawerShell.tsx} — review surfacing, current silent-empty UX"
  - "src/onboarding/draft-promoter.ts — authoritative promotion (product_pages, customFields, ShopSite XML)"
  - "store/classification/*.json + src/classification/config-loader.ts + src/classification/releases/bay-state-v3+v4 — taxonomy bundles + frozen manifests"
  - "docs/adr/0004-compose-classification-from-replaceable-stages.md + 0012 + tech-stack.md (Gray areas & debt) — stage composition SoT"
  - "context.md (scout 2026-08-20) — full curation map, debt signals, 7 open questions (title metric, gating, applicability visibility, species guard, cohort scope, taxonomy edit path, description synthesis)"
  - "specs/tech-architecture/tech-stack.md + AGENTS.md § Onboarding Pipeline & Curation Architecture — entry points"
