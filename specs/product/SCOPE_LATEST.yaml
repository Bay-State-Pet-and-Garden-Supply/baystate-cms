# specs/product/SCOPE_LATEST.yaml — bounded PRD for e06 Profile Workspace + Guided Setup
# Spine: scope-work → slice-tasks → plan-work. This file is the scope boundary (what/why, not how).
# Replaces prior e03/e24 placeholder scope — that increment is done. This SCOPE opens the next bounded increment.

core_value: "Operators can set up a new brand's official domain and activate a reliable extractor profile in one guided flow, tested against real indexed products, without pasting URLs or failing late in extraction."

summary: |
  Setting up a new brand for official-page extraction is fragmented — brand, domain, sitemap index, and profile are configured in separate places, a missing profile is not enforced until an item fails late in Extraction, and the current editor is an inline form inside the domain table with no LLM help and paste-a-URL testing. Operators routinely drift into onboarding without a viable profile and lack clear readiness guidance.

  This increment stitches that seam into one guided flow fronted by a dedicated, domain-centric Profile Workspace. The workspace surfaces readiness (domain verified → product URLs indexed → 3 representative products confirmed → draft generated → tests pass → human approval/activation), exposes per-field LLM proposals with deterministic validation, and runs a full-width test matrix against real indexed products sourced from brand_url_index (candidate = sitemap-only, confirmed = operator-confirmed). A single domain-level task — "Build profile for example.com — unblocks N products" — replaces scattered failure-derived blockers, and activation deterministically releases items that were parked at the Discovery→Extraction boundary as setup_required_profile.

  Success is operator-observable: adding a brand with an official domain, indexing product URLs, confirming three representative products, generating and testing a draft, and activating the profile unblocks queued extraction without manual URL entry. Verification rests on readiness state, test evidence bound to an exact draft version, immutable version history with provenance, and a hard activation gate — not on model confidence or post-hoc degradation.

in_scope:
  - "e06s01 — Dedicated Profile Workspace (full page at /settings/domains/:domain/profile): domain-scoped workspace with header (brand associations, domain, active version, freshness, blocked count), left readiness rail, build canvas grouped by field, sticky evidence rail, and history; replaces inline table form + modal/overlay builders; entry via brand/domain checklist, domain inventory, extraction blocker task, and pipeline item"
  - "e06s02 — Guided brand → domain → index → confirm flow: add/select brand, assign guarded official domain, discover/index brand_url_index product URLs, confirm 3 representative products from candidates with explicit waiver when fewer exist; sitemap/product inventory and candidate/confirmed distinction surfaced in the workspace"
  - "e06s03 — LLM-assisted build + deterministic validation: task-button tooling (Generate draft from samples / Suggest alternatives / Explain failure / Revise from feedback) where deterministic discovery runs first and the LLM only proposes schema-validated selectors with evidence/warnings; per-field human accept/reject/revise; syntax/domain/match-count/visibility/cross-sample/identity/variant checks; fail clearly when no model route is available"
  - "e06s04 — Indexed-product Test Matrix + activation gate + release: full-width matrix rows=confirmed products, cols=fields plus identity/variant checks, executed via production static/rendered runner, bound to exact draft version with retained artifacts; activation requires required title on every confirmed sample, no wrong-product/wrong-variant, no failing required field (image rule: two-sample + preview attestation); parked official_page items held as setup_required_profile advance deterministically on activation; distributor_record items bypass profiles entirely"

in_scope_ids:
  - e06s01
  - e06s02
  - e06s03
  - e06s04

out_of_scope:
  - "Sourcing/Discovery heuristic redesign — deferred as separate product decision (why: not required to unify the profile seam; current discovery stays as-is, distributor-record fallback unchanged)"
  - "Full pipeline board / Curation / Review / Promotion overhaul — deferred (why: downstream stages remain human-gated; this increment parks/releases at the extraction boundary only and does not change review/export authority)"
  - "External merchant roles / permissions beyond workspace ownership — deferred (why: workspace is internal admin/power-user only; no new RBAC model needed)"
  - "Changes to product_pages (SKU→ ShopSite Category Page assignments) — out (why: no URL/domain data; unrelated to extractor profiles; would expand scope to catalog publication)"
  - "Open-ended chatbot UX or direct LLM save/activate paths — out (why: proposal-only governance + human per-field approval + model-confidence-never-activates is the safety contract; chatbot and auto-activation would bypass it)"
  - "e24 capability implementation (future epic e24 deferred capability) — remains deferred pending its own elaborate-spec/ADR (why: explicitly bounded out of this seam; implementing now would be speculative)"

constraints:
  - "Domain-scoped profiles (multiple brands may share one domain); workspace shows brand associations in breadcrumb/header and preserves return context via query state"
  - "brand_url_index is the indexed-product source (sitemap product URLs + enriched metadata via sitemap-routes); not product_pages; candidate vs confirmed distinction must be surfaced"
  - "Parking contract: official_page items park at Discovery→Extraction as setup_required_profile (single domain task) and release deterministically on activation via existing onboarding-work-api path; distributor_record bypasses profiles"
  - "Representative suite: 3 confirmed products minimum (3-10 persistent suite covering templates/variants/edges); waiver with reason+actor when fewer exist; traceability requires exact draft version + retained artifact binding"
  - "Immutable activated versions with domain active-version pointer (selectors, runtime/variant settings, sample IDs, artifact hashes, validation summary, model/config provenance, approver, reason); rollback moves pointer atomically and revalidates"
  - "Human per-field approval mandatory; AI proposes, deterministic code validates; no existing active profiles are grandfathered — they must re-pass the gate (degrade until validated); regressions trigger on edits/drift but never auto-activate"
  - "Cloud LLM permitted by default with disclosure; no per-workspace consent gate; every model/selector decision records provider/model/prompt/config and whether HTML left the machine"
  - "Reuse, never duplicate: Profile governance (#45), brand_url_index/sitemap inventory, profile runner (trusted static/rendered), onboarding-work release, PI execution boundary where LLM path is exercised"
  - "Runtime: Bun 1.3.5, TS 5.9, SQLite bun:sqlite, Hono 4, React 19/Vite 6; keep bun run typecheck && bunx vitest run && bun run test:db green; CI skips lint (advisory)"
  - "Process: scope-work → slice-tasks → plan-work → build-epic per story; every in_scope item maps to an e06sNN per HARD GATE"

success_criteria:
  - "Operator can demo end-to-end without pasting a URL: add brand + guarded official domain → index finds product URLs → confirm 3 representative products → open /settings/domains/:domain/profile → Generate draft → test matrix green on all 3 → Activate → parked setup_required_profile items (≈14 in demo) release and extract successfully"
  - "Enforcement observable: official_page items without an active profile park as setup_required_profile (distinct from failed) and surface one domain task 'Build profile for example.com — unblocks N products'; distributor_record items are not parked and proceed to profile-free extraction"
  - "Activation gated: selector failing on 1 of 3 confirmed samples hard-blocks activation with per-field expanded reason (expected vs actual, provenance, artifact, failure reason) and a Revise action; passing run is bound to exact draft version and retained artifacts; waiver path observable when <3 URLs exist"
  - "Workspace state + history observable: header/readiness rail reflect Not configured · Draft · Needs testing · Ready for approval · Active · Degraded; history shows immutable versions with actor/model/config, diffs, and activation/rollback events; health is server-derived (distinct from sitemap freshness, reachability, LLM availability, model confidence)"
  - "Governance preserved: LLM output never directly saves or activates; per-field accept/reject/revise is required; provider/model/prompt/config recorded on every proposal; fallback to verified view on malformed plan"

