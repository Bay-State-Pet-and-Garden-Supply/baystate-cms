# specs/product/SCOPE_LATEST.yaml — bounded PRD for Brand Sourcing, Discovery & Extraction Strategy Hub
# Spine: scope-work → slice-tasks → plan-work. This file is the scope boundary (what/why, not how).
# Replaces e07 scope (planned — e07 not yet landed per release-plan; e08 depends on e07s04 for governed readiness + OnboardingSettings ownership)

core_value: "Operators audit every brand's legitimate sourcing, discovery, and extraction strategy from one place — seeing at a glance which distributors are preferred, which official domain and sitemap health back discovery, and whether the extractor profile is governed-ready — without hunting two settings tabs."

summary: |
  The onboarding pipeline is brand-driven (ADR 0017: Brand Resolution decides legitimate sources; ADR 0014: Sourcing is default-ON with tiered distributor_record_to_extraction vs fallback_to_discovery), but Settings is domain-driven and split-brain: the Brands tab is a domain-keyed sitemap index (SitemapHealthView) with zero distributor visibility, while the only distributor-routing config (Advisory Brand Profiles — aliases + preferredDistributorIds + sourcingPolicy) is hidden below connector credentials in the Distributors tab. BatchPreflightModal already does unified Brand+Domain+Distributor setup per-batch, but there is no persistent brand-level surface to tune or audit that strategy before the next import — and distributor-only brands (no official site) are invisible in Brands.

  This increment (e08) promotes Brands into a Brand Sourcing, Discovery & Extraction Strategy Hub as a **read aggregation** — not a new canonical brands table. One row per normalized brand string joins existing sources (brand_sites + brand_advisory_profiles + extractor_profiles + brand_url_index/sitemap telemetry via sitemap-inventory-service + governed readiness from domain-profile-state-repo) and delegates writes to existing repos. The Distributors tab is stripped to pure Connection Infrastructure. Ranking is distributor-organization with tiered-concurrent semantics (preferred tier concurrent → fallback tier conditional), SourcingPolicy stays as runtime implements (advisory | preferred_then_fallback | preferred_only), retailer denylist stays global read-only, and the app remains single-store global (workspaces deprecated, singleton workspace persisted). BatchPreflight→Hub persistence is deferred — v1 makes distributor-only brands visible and makes per-brand strategy auditable via vertical slices that each deliver operator value.

in_scope:
  - "e08s01 — Vertical audit slice: Brand Strategy projection + minimal Brands grid — GET /api/onboarding/brands/strategy join (brand_sites + advisory profiles + exact normalized-brand authority with non-authoritative possible_match/ambiguous diagnostics, no migration) and Brands tab renders minimal grid (Brand Identity + aliases advisory, Sourcing tier as Preferred/Fallback tier pills — not sequential [1]->[2] — with 'All Enabled' fallback, Official Domain column with 'No official site configured' and distributor-only handling as 'Profile bypass eligible when distributor evidence qualifies'); globally presented but persisted under server-derived singleton workspace, retailer banner rendered once as global read-only"
  - "e08s02 — Vertical management slice: move Advisory Brand Profiles editor into Brands Hub (create/edit/delete with sourcingPolicy round-trip fix in distributor-routes + onboarding-api client), enrich rows with sitemap health drill-in (counts/freshness/last refresh) and governed extraction readiness (domain-profile-state active version + evidence) plus per-row link to Profile Workspace at /settings/domains/:domain/profile; depends on e07s04; engine org-fanout conformance fix (distributor org fans out to ALL enabled connections, dual-connector regression test for phillips + phillips_storefront)"
  - "e08s03 — Parity-gated cleanup: remove Advisory Brand Profiles form from DistributorConnectionsPanel only after e08s02 proves create/edit/delete parity in Brands Hub; keep connector CRUD + health/enable + secretConfigured; finalize OnboardingSettings tabRegistry copy/routing (Brands = Strategy Hub, Sitemaps = raw inventory, Distributors = Connection Infrastructure); enforce single-store global singleton workspace selection, fail-closed diagnostic if multiple legacy workspaces found"

in_scope_ids:
  - e08s01
  - e08s02
  - e08s03

out_of_scope:
  - "New canonical brands table, brand identity migration, alias canonicalization or fuzzy matching — deferred (why: aggregation join on exact normalized brand surfaces mismatches explicitly; canonical model needs measured collision data before a migration)"
  - "New Sourcing policies (distributor_only, bypass_sourcing) or strict-sequential distributor priority — out (why: would amend ADR 0014 default-ON contract and engine evidence/conflict behavior; v1 keeps tiered-concurrent advisory/preferred_then_fallback/preferred_only)"
  - "Per-brand retailer or approved_retailer authority editing and dynamic retailer detection — deferred to ADR 0017 Phase 2-3 (why: retailer list is global code policy src/onboarding/discovery/retailer-domain-list.ts; per-brand edits need schema and source-taxonomy work)"
  - "Full BatchPreflightModal → Strategy Hub persistence in v1 — deferred (why: v1 is read-mirror proving value; convergence needs a shared server-derived strategy projection and risks duplicating preflight logic)"
  - "Sourcing/Discovery heuristic redesign, distributor_record merchandising-depth changes, or brand→approved_retailer taxonomy — out (why: separate product decisions; materialization stays profile-free and deterministic)"
  - "Full Curation/Review/Promotion overhaul beyond releasing parked items — deferred (why: downstream stays human-gated; this epic only makes parked items auditable via Strategy Hub)"
  - "Workspace/merchant RBAC reintroduction — out (why: single-store app; workspaces deprecated; global Hub avoids cross-workspace leakage by being singleton-workspace)"

constraints:
  - "Aggregation-only in v1: no brands migration; join is exact normalized brand (brand_name lower+trim); non-authoritative possible_match/ambiguous diagnostics use conservative comparison; writes delegate to brand-site-repo / distributor-repo / extractor-profile-repo / brand-url-index-repo; unmatched brands surfaced, not silently merged"
  - "SourcingPolicy enum frozen to advisory | preferred_then_fallback | preferred_only (src/shared/schemas/distributor.ts); distributor-only expressed as preferred_only + no official domain with 'Profile bypass eligible when distributor evidence qualifies'; retailer denylist global read-only, rendered once as banner"
  - "Ranking = distributor organization (distributorId) that fans out to ALL enabled connections per distributor (fix engine.ts Map<distributorId, connection> single-entry bug), tiered-concurrent (preferred tier concurrent, fallback tier conditional); UI shows Preferred tier / Fallback tier pills, not sequential [1]->[2]"
  - "Single-store global Hub: globally presented but persisted under server-derived singleton workspace ID (never union historical workspaces); define exact-one store partition, fail-closed if multiple legacy workspaces; domain normalization single point lower+strip www+strip scheme/path at repo boundary; brand_url_index sole sitemap inventory (page_type=product, active=1)"
  - "Extraction readiness from domain-profile-state-repo active version + MatrixResult evidence (governed), not selector-presence view-model; profile-free is conditional runtime route (qualified distributor_record → distributor_record_to_extraction), not permanent brand property; depends on e07s04"
  - "Distributors tab becomes infra-only only after parity: DistributorConnectionsPanel loses Advisory Brand Profiles section only when Brands Hub proves parity; connection CRUD keeps secret_ref masked, secretConfigured boolean, enabled disabled-on-create (Amendment A fail-closed)"
  - "Reuse, never duplicate: sitemap-inventory-service + domain-profile-state-repo + profile-workspace route + retailer-domain-list; Hub links to existing canonical surfaces for domain/profile editing; e08 depends on e07s04, do not implement concurrently"
  - "Runtime: Bun 1.3.5, TS 5.9, SQLite bun:sqlite, Hono 4, React 19/Vite 6; keep bun run typecheck && bunx vitest run && bun run test:db green; CI skips lint (advisory); DESIGN.md 'The General Store' tokens (Operate density, semantic badges)"

success_criteria:
  - "Operator opens Settings → Brands and audits every brand in one grid: brand identity + aliases (advisory), sourcing tier (Preferred/Fallback tier pills or 'All Enabled'), official domain(s) with sitemap counts/freshness, and governed extractor readiness badge (or explicit 'No official site configured' + 'Profile bypass eligible when distributor evidence qualifies') — without opening Distributors"
  - "Distributor-only brands (no official site) appear in Brands Hub for first time; brands with official sites show real sitemap health and link to Profile Workspace at /settings/domains/:domain/profile; unmatched/ambiguous brands surfaced explicitly, not silently joined"
  - "SourcingPolicy round-trips via API and Hub editor: creating/updating an advisory brand profile with preferredDistributorIds + sourcingPolicy persists and re-renders in Brands Hub; distributor-routes no longer drop sourcingPolicy; editor lives in Brands Hub, not Distributors"
  - "Distributors tab shows only connection infrastructure (CRUD, health, enable) after parity — Advisory form gone only when Hub editor proves parity; retailer denylist shown once as global read-only banner if shown at all"
  - "No silent brand merges and no concurrent e07/e08 churn: e08 UI enrichment waits on e07s04 governed readiness + OnboardingSettings ownership; engine correctly fans out org preference to all enabled connections (dual-connector test passes)"

