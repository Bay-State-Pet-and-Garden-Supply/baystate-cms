# specs/product/SCOPE_LATEST.yaml — bounded PRD for e07 Template-aware Sitemap Profile Workbench
# Spine: scope-work → slice-tasks → plan-work. This file is the scope boundary (what/why, not how).
# Replaces e06 scope (landed v0.3.0) — e06 workspace stays, e07 reworks the extraction recipe abstraction per oracle.

core_value: "Operators build reliable extractor profiles for templated sitemap product pages by confirming template-aware suggestions and clicking values on a captured snapshot — without writing CSS — with every change verified against all templates before activation."

summary: |
  The current Profile Builder (e06) treats extraction as editing a bag of CSS selectors for one page (SelectorInput + paste-outerHTML + advisory DOMParser eval). Brand product pages are templated — a domain has 1..N product templates distinguished by path shape + rendered DOM — and the single-selector model produces brittle profiles, late variant failures, and high friction. Surfaces are fragmented (deprecated ProfileBuilderWorkspace overlay, modal in OnboardingSettings/Onboarding, inline workspace) and the capture path races (snapshotPageForBuilder + separate fetchPageHtml).

  This increment (e07) keeps e06's guided seam (brand → guarded domain → sitemap index → 3 confirmed representatives → workspace → park/release) but reworks the core abstraction: a domain profile version may contain multiple template-specific routes (path hint + DOM fingerprint + per-field recipes). Recipes prefer structured sources (JSON-LD, Shopify/WooCommerce) then stable CSS fallbacks + transforms, ranked and cross-sample verified. Clustering is conservative (path + DOM Jaccard) and suggests representatives maximizing coverage; the operator confirms/overrides. Correction is visual on a synchronized single capture artifact (DOM + screenshot + runtime + hash) — click a value → system ranks candidates and highlights/tests across every confirmed sample instantly. Raw CSS lives under Advanced. Activation is hard-blocked until the production runner passes every confirmed sample and every included cluster. Two persistence debts landed in e06 as Maps are fixed: immutable versions become transactional with an atomic active pointer, and testsPass derives from persisted MatrixResult evidence, not active+3.

  Live spike (earthanimal.com /products/* Shopify) proved template-aware prefix /products + DOM similarity clusters correctly; parked/hijacked domains (acmepet.com) proved inventory must be verifier-filtered before suggesting reps.

in_scope:
  - "e07s01 — Fix persistence + evidence-gated activation: migrate profile-version-repo from in-memory Maps to transactional SQLite (profile_versions + profile_active, atomic active pointer + rollback), bind MatrixResult artifact_hashes to version hash, derive testsPass/readiness from persisted runner evidence (not state.active+3); revalidation on drift, distributor_record bypass preserved"
  - "e07s02 — Conservative template clustering + representative suggestion: path-aware clustering (strip slug/ID → /products, /product, /p etc. + tag+class Jaccard 0.8 conservative), auto-suggest reps covering each cluster/variant/edge, operator confirm/override affordance; inventory filtered by sitemap-inventory-service freshness + page-verifier/sitemap-health before suggestion; waiver when <3 verified URLs"
  - "e07s03 — Single capture artifact + visual correction: one Playwright capture per sample (serialized DOM + screenshot + runtime + hash, networkidle+1s), replay for click→element→ranked candidates (JSON-LD > [data-testid] > shopify-section > semantic > generic per selector-utils 6-tier), extracted-VALUE previews per field per sample, instant highlight/test across all samples; delete GenerateSelectorPopover paste-HTML and independent HTML-fetch hop; local DOM eval stays only as labeled instant feedback"
  - "e07s04 — Workbench consolidation + hard-block release: collapse to single inline workbench at /settings/domains/:domain/profile (value previews + 'Select on page' affordance, Advanced for raw CSS), delete ProfileBuilderWorkspace overlay + modal callers in Onboarding.tsx/OnboardingSettings.tsx, keep readiness rail (Not configured·Draft·Needs testing·Ready for approval·Active·Degraded) server-derived, hard-block park as setup_required_profile → deterministic release via onboarding-work-api"

in_scope_ids:
  - e07s01
  - e07s02
  - e07s03
  - e07s04

out_of_scope:
  - "Sourcing/Discovery heuristic redesign and distributor_record profile-free flow changes — deferred (why: distributor_record already URL-null merch-depth; discovery stays, inventory still brand_url_index; separate product decision)"
  - "Full Curation/Review/Promotion overhaul beyond releasing parked items — deferred (why: downstream stays human-gated; this epic parks/releases at extraction boundary only)"
  - "SKU→product_pages Category Page assignment changes — out (why: no URL/domain data; unrelated to extractor recipes)"
  - "External merchant roles/permissions beyond workspace ownership — deferred (why: internal power-user only; no new RBAC)"
  - "Open-ended chatbot UX or live-remote-iframe editing — out (why: proposal-only governance + per-field approval + confidence-never-activates is the safety contract; CSP/auth/mutation make live iframe brittle — oracle recommends capture replay)"

constraints:
  - "brand_url_index is sole sitemap inventory (page_type=product, active=1, FTS5); candidate vs confirmed distinction mandatory; counts/freshness via sitemap-inventory-service + domain-profile-state-repo"
  - "Domain owns versioning but version may contain multiple template routes (path hint + DOM fingerprint + per-field recipes) — oracle-approved Q1 A; URL pattern seeds clustering, DOM similarity establishes identity"
  - "Conservative clustering Q2 A: path+DOM Jaccard 0.8 + prefix guard; auto-suggest reps maximizing cluster/variant/edge coverage; operator confirms/overrides; filter by freshness + page-verifier before suggestion"
  - "Single capture artifact Q3 A: DOM+screenshot+runtime+hash (networkidle+1s) replay for click; no live iframe; local eval is instant feedback only, production runner (static/rendered) is ground truth"
  - "Authoring loop: auto-detect → inspect VALUES across samples → visually correct → deterministic matrix (production runner) → activate; operator identifies values, system ranks recipes; raw CSS under Advanced"
  - "Representative invariant: 3 confirmed minimum, waiver (reason >=8 chars + actor + hash immutable) if <3 verified URLs; matrix must pass every confirmed sample AND every included cluster before activation; fix testsPass debt now Q4"
  - "Enforcement: park official_page at Discovery→Extraction as setup_required_profile (single domain task) and release deterministically on activation via onboarding-work-api; distributor_record bypass via profile-blockers.ts"
  - "Single inline workbench at /settings/domains/:domain/profile; delete deprecated overlay/modal/paste-HTML/independent-fetch; domain normalization single point (lower+strip www+strip scheme/path at repo boundary)"
  - "LLM closed-world advisory only (profile_generation task, allowFallback false, MissingLlmTaskConfigError, disclosure badge); prompt hashes captured; confidence never activates"
  - "Runtime: Bun 1.3.5, TS 5.9, SQLite bun:sqlite, Hono 4, React 19/Vite 6; keep bun run typecheck && bunx vitest run && bun run test:db green; CI skips lint (advisory)"
  - "Reuse, never duplicate: brand_url_index/sitemap inventory, profile runner (trusted static/rendered), onboarding-work release, selector-utils 6-tier"

success_criteria:
  - "Without writing CSS or pasting HTML, operator can confirm cluster-suggested 3+ representatives (or waiver) → see value previews per field across all samples → click a value on capture replay → candidate is re-ranked and highlighted/tested everywhere instantly → activate only when matrix passes every sample and every cluster"
  - "Clustering observable: /products templates group correctly (earthanimal.com 3/3), parked/spam domains (acmepet.com) are filtered by verifier before suggestion, operator override (merge/split cluster) persists"
  - "Persistence verifiable: version is immutable row with selector/runtime/sampleIds/artifactHashes/validationSummary/provenance; active pointer swaps atomically; testsPass/readiness derived from MatrixResult artifact binding, not active+3; restart does not lose versions"
  - "Enforcement observable: official_page items without active profile park as setup_required_profile (distinct from failed) with one domain task 'Build profile for example.com — unblocks N products'; distributor_record items are not parked; activation releases parked items"
  - "Governance preserved: per-field accept/reject/revise required; LLM proposals are schema-valid, carry evidence/warnings and prompt hash; raw CSS only in Advanced"

