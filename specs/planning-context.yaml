# specs/planning-context.yaml — written by elaborate-spec; consumed by scope-work and slice-tasks
feature_name: "Brand Domain Profile Workspace + Guided Setup"
problem_statement: >
  Adding a new brand's official domain is fragmented (add brand → add domain →
  sitemap index → build profile), the missing-profile state is not enforced
  upfront and only fails late in Extraction, and the current editor is an
  inline form crammed inside the domain table with no LLM help and paste-a-URL
  testing. Operators can drift into onboarding without a viable profile and lack
  clear guidance or testing against real indexed products.

constraints:
  - "Profile ownership is domain-scoped (extractor_profiles per domain); brands are associations shown in header. URL: /settings/domains/:domain/profile as a dedicated full page (not drawer/modal/overlay)."
  - "Indexed products = brand_url_index (sitemap product URLs + title/UPC/SKU) via sitemap-routes.ts inventory API; not product_pages."
  - "Guided upstream: brand → guarded official domain → discover/index product URLs → confirm 3 representative confirmed products (candidate vs confirmed) → Profile Workspace (header + readiness rail + build canvas + evidence rail + test matrix + history) → activate → deterministically release."
  - "Enforcement parks official_page items at Discovery→Extraction as setup_required_profile (not failed) with a domain-level readiness task 'Build profile for example.com — unblocks N products'; award via existing release mechanism (onboarding-work-api.ts)."
  - "Representative suite = 3 confirmed products minimum; persistent suite of 3-10 covering templates/variants/edges; explicit waiver with reason+actor if <3 product URLs exist."
  - "Testing via same production static/rendered profile runner; activation gate: required title succeeds on every confirmed sample, no wrong-product/wrong-variant, no failing required field, image rule (two-sample + preview attestation) preserved, result bound to exact draft version + artifacts."
  - "Immutable activated versions with domain active-version pointer (selectors, runtime/variant settings, sample IDs, artifact hashes, validation summary, model/config provenance, approver, reason); rollback moves pointer atomically and revalidates."
  - "Human per-field approval mandatory: AI proposes selectors/alternatives, deterministic code validates (syntax, domain, match-count, visibility, cross-sample, identity, variant), human accepts/rejects/revises; model confidence never activates."
  - "LLM tooling as task buttons (Generate draft from samples / Suggest alternatives / Explain failure / Revise from feedback), deterministic discovery first (JSON-LD/Shopify/WooCommerce), schema-validated candidates with evidence/warnings; cloud LLM permitted by default with disclosure badge, fail clearly if unavailable."
  - "Existing mutable active profiles must re-pass the 3-sample gate (no grandfather); until then degrade to Degraded/Needs testing, extraction blocked via park."
  - "Selector fails on 1 of 3 confirmed samples hard-blocks activation with expanded per-field reason (expected vs actual, provenance, artifact) and Revise action; regressions trigger on edits/drift but never auto-activate."
  - "distributor_record items bypass profiles entirely (profile-free extraction) — must not be gated."

out_of_scope:
  - "Sourcing/Discovery heuristic redesign"
  - "Full pipeline board / Curation / Review / Promotion overhaul"
  - "External merchant roles / permissions beyond workspace ownership"
  - "Changes to product_pages (ShopSite Category Page assignments) or SKU→page mapping"
  - "Open-ended chatbot UX; direct LLM save/activate paths"

key_decisions:
  - decision: "Dedicated full-page workspace at /settings/domains/:domain/profile with sticky header, readiness rail (6 steps), grouped build canvas, evidence rail, full-width test matrix, and history"
    rationale: "Replaces inline table form + two divergent modal/overlay builders; provides status, evidence, and governance in one place."
  - decision: "Bounded scope = brand→domain→index→confirm→profile→release seam; broader onboarding pipeline stays out as follow-on epics"
    rationale: "User chose interpretation 1 (bounded improvement) to keep spec tight and shippable."
  - decision: "brand_url_index as the indexed-product source; candidates vs confirmed distinction"
    rationale: "Oracle found product_pages has no URL/domain; brand_url_index + sitemap-routes already expose correct inventory."
  - decision: "Park as setup_required_profile at Discovery→Extraction with domain task instead of late failure"
    rationale: "Current enforcement fails after Extraction (job-queue.ts:1631) causing late, error-string-derived tasks; early park is clear and reversible."
  - decision: "Require 3 confirmed samples; explicit waiver if fewer exist"
    rationale: "User confirmed 3 (up from 2); ensures cross-template stability without silently lowering threshold."
  - decision: "No grandfathering — existing active profiles must pass new gate"
    rationale: "User decision #1; ensures quality bar applies uniformly; legacy shown as Active (legacy)/Degraded with regression recommended."
  - decision: "Cloud LLM permitted by default with disclosure; no per-workspace consent gate"
    rationale: "User decision #2; keeps Generate/Suggest usable out-of-the-box while remaining auditable."
  - decision: "Hard-block activation on selector failure (expanded reason + Revise task)"
    rationale: "User flagged Selector Fails as key failure; deterministic runner evidence must gate activation, not post-hoc degradation."
