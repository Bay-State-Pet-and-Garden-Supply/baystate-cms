# specs/planning-context.yaml — written by elaborate-spec; consumed by scope-work and slice-tasks
feature_name: "Template-aware Sitemap Profile Workbench"
problem_statement: >
  The current Profile Builder models extraction as editing a bag of CSS selectors
  for a single page (SelectorInput + paste-outerHTML + advisory DOMParser eval).
  Sitemap product pages are templated — a domain has 1..N product templates
  (path + DOM structure) sharing one domain profile. Operators must think in CSS
  and manually verify across arbitrary 3 samples, with fragmented surfaces
  (deprecated overlay, modal, inline), a two-hop snapshot/HTML race, and an
  activation gate that only tests title. The result is high friction, brittle
  selectors, and late discovery of template-variant failures. The workbench
  must become a low-friction, template-aware, visually-corrected recipe learner
  that still respects sitemap inventory, 3-sample governance, and deterministic
  verification.

constraints:
  - "brand_url_index is sole sitemap inventory (page_type=product, active=1, FTS5); not product_pages. Candidate vs Confirmed distinction mandatory; counts/freshness via sitemap-inventory-service + domain-profile-state-repo."
  - "Domain is ownership/versioning boundary, but a domain profile VERSION may contain multiple template-specific routes (oracle-approved A). Each route = path hint + rendered-DOM fingerprint + field recipes (JSON-LD/Shopify/WooCommerce preferred, CSS fallback + transforms). URL patterns seed clustering, DOM similarity establishes identity."
  - "Conservative template clustering (Q2 A): auto-infer clusters from path+DOM, auto-suggest representatives maximizing cluster/variant/edge coverage; operator explicitly confirms/overrides clusters and reps."
  - "Visual correction on synchronized captured artifact (Q3 A): single browser capture per sample (DOM + screenshot + runtime + hash); click on screenshot/DOM replay maps to element metadata and ranks candidate recipes; no live remote iframe (CSP/auth/mutation). Apply + highlight/test across every confirmed sample instantly."
  - "Authoring loop: auto-detect → inspect extracted VALUES across samples → visually correct → deterministic matrix (production static/rendered runner) → activate. Operator identifies values, system generates/ranks recipes. Raw CSS under Advanced only."
  - "Representative invariant: 3 confirmed minimum, waiver (reason >=8 chars + actor + hash, immutable) if <3 URLs exist. Matrix must pass every confirmed sample AND every included cluster via production runner before activation. Fix testsPass debt now (Q4): derive from persisted MatrixResult evidence, not active+3; fix immutable version persistence transactionally (profile-version-repo was in-memory) before UI redesign."
  - "Enforcement and activation gate unchanged: park official_page at Discovery→Extraction as setup_required_profile with domain task (release via onboarding-work-api), fail-closed on wrong_product/wrong_variant/imageRule, distributor_record profile-free bypass (profile-blockers.ts)."
  - "Single workspace surface at /settings/domains/:domain/profile (inline workbench); delete deprecated ProfileBuilderWorkspace overlay, modal modes and callers in Onboarding.tsx/OnboardingSettings.tsx, GenerateSelectorPopover paste-HTML path, independent HTML-fetch hop. Local DOM eval only as labeled instant feedback, not evidence."
  - "LLM remains closed-world advisory (profile_generation task, allowFallback false, MissingLlmTaskConfigError, disclosure badge); model confidence never activates; prompt hashes captured."
  - "Domain normalization single point (lower+strip www+strip scheme/path at repo boundary); per-domain immutable versions + atomic active pointer; sitemap reconcile txn invariants preserved."

out_of_scope:
  - "Sourcing/Discovery heuristic redesign and distributor_record flow changes"
  - "Full Curation/Review/Promotion overhaul beyond releasing parked items"
  - "SKU→product_pages Category Page mapping changes"
  - "External merchant roles/permissions beyond workspace ownership"
  - "Open-ended chatbot UX or live-remote-iframe editing"

key_decisions:
  - decision: "Domain owns version, version routes per-template (multi-template profile). Path hint + DOM fingerprint + per-field recipes; structured data preferred, CSS fallback ranked and cross-sample verified."
    rationale: "Oracle diagnosis: real task is learning recipes for every template, not editing selectors for one page — matches sitemap-templated discovery."
  - decision: "Conservative auto-clustering (path + DOM similarity) with operator-confirmed reps (Q2 A) and capture-based visual correction (Q3 A)"
    rationale: "Lowest friction that stays auditable; avoids aggressive merging and brittle live-iframe (CSP/auth). Single capture artifact eliminates snapshot/HTML race."
  - decision: "Fix testsPass and immutable-version persistence debt in this epic (Q4)"
    rationale: "Gate currently derives from active+3 and versions are in-memory; must be evidence-grounded and transactional before new UX ships."
  - decision: "Replace field cards with extracted-value previews + 'Select on page' affordance; CSS under Advanced"
    rationale: "Inverts selector-first interaction — operator points at value, system proposes recipes and verifies everywhere."
  - decision: "Delete: ProfileBuilderWorkspace overlay, modal callers, GenerateSelectorPopover, paste-outerHTML path, independent HTML fetch. Keep local eval only as instant feedback."
    rationale: "Removes fragmented, brittle paths per scout/oracle; leaves single workbench surface."
