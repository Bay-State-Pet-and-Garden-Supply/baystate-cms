  <script id="XC_SiteLogin" type="text/template">

          <form id="loginFormDsk" class="cc_login_form">
            <div class="panel panel-default cc_panel cc_user_login">
              <div class="panel-heading cc_heading">
                <div class="visit"><i class="fa fa-sm fa-arrow-right login-info-arrow-icon"></i> <a href="https://phillipspet.com/" class="enter-main-website-link" target="_blank">Enter main Phillips Pet Food & Supplies site</a></div>
                <img id="cc_store_logo_img" class="cc_store_logo_img" src="{{getLogoUrl}}" />
                <h3 class="panel-title cc_title">Please sign in with your Phillips Pet website credentials</h3>
              </div>
              <div class="panel-body cc_body">
                <p class="help-section-detail-text mobile-help-link"><i class="fas fa-arrow-right login-info-arrow-icon"></i><a href="#login-info-section">Having trouble logging in? Read this</a></p>
                <div class="form-group">
                  <label for="emailField">Username/E-Mail *</label>
                  <input id="emailField" name="emailField" type="email" class="loginInput form-control cc_login_input" value="{{displayUsername}}" title="Username/E-Mail" placeholder="Username/E-Mail *"/>
                </div>
                <div class="form-group">
                  <label for="passwordField">Password *</label>
                  <input id="passwordField" name="passwordField" type="password" class="loginInput form-control cc_password_input" placeholder="Password *"/>
                </div>
                <input type="button" id="send2Dsk" class="btn btn-primary btn-block cc_login_button" value="Login" />
                <div class="row">
                  <div class="col-xs-5">
                    <a href="https://www.phillipspet.com/support/contact-us/" class="contactUs">Contact Us</a>
                  </div>
                  <div class="col-xs-7 text-right">
                    <a href="javascript:void(0);" class="forgotPass cc_forgot_pass">Forgot Your Password?</a>
                  </div>
                </div>
                <div class="row">
                    <br>
                    <br>
                    <span align="center" class="needHelpText" style="margin:auto; display:table;"><strong>Need help?</strong> View <a href='https://www.phillipspet.com/support/phillips-ordering-website-guide/'>our guide</a>
                </div>
              </div>
            </div>
          </form>
        </div><!--**********-->
        <div class="col-sm-6 col-sm-offset-3 col-md-6 col-md-offset-0">
          <div class="panel panel-default cc_panel cc_user_login login-help-box">
            <h3 id="login-info-section">Having trouble logging in?</h3>
            <div class="login-help-signon-instructions">
              <p class="help-section-heading-text">Sign on using your email address</p>
              <p class="help-section-detail-text">Improved security with new username/passwords. No longer will you need to share your username and password with all employees, but rather grant individual access rights.</p>
            </div>
            <div id="login-info-help" class="accordion accordion-body collapse in expanded-login-help">
              <p class="help-section-heading-text">Why did we change to using an email?</p>
              <p class="help-section-detail-text">- Increased security for you, with personal usernames and private passwords.</p>
              <p class="help-section-detail-text">- It will let you control over the access level of each user; Choose to give single location purchase rights, or full chain purchase rights.</p>
              <p class="help-section-detail-text">- Secure passwords; never have to share a password again!</p>
              <p class="help-section-heading-text">Ways to sign up:</p>
              <p class="help-section-detail-text"><i class="fas fa-arrow-right login-info-arrow-icon"></i>Visit <a class="login-info-link" href="http://phillipspet.com/support/web-access">phillipspet.com/support/web-access</a> and complete the web form.</p>
              <p class="help-section-detail-text"><i class="fas fa-arrow-right login-info-arrow-icon"></i>Contact Customer Care at 800-451-2817.</p>
              <p class="help-section-detail-text"><i class="fas fa-arrow-right login-info-arrow-icon"></i>Email <a class="login-info-link" href="mailto:orders@phillipspet.com">orders@phillipspet.com</a> requesting access, please include your name, email, telephone number, account name and account number.  If you need access to multiple locations, please list all.</p>
            </div>
            <div class="expand-hide-msg">

	<script id="XC_MiniCart-RemoveDialog" type="text/template">
   <a class="modalLauncher" style="display:none" href="#removeMod" data-backdrop="static" data-toggle="modal">&#160;</a>&#160;
   <div id="removeMod" class="modal fade" tabindex="-1" role="dialog">
   <div class="modal-dialog" role="document">
    <div class="modal-content">
    <div class="modal-header">
     <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&#215;</span></button>
     <h4 class="modal-title">{{pageLabelMap 'Cart_Remove_Prompt'}}</h4>
    </div>
    <div class="modal-body">
     <ul>
     {{#each this.zeroValues}}
      {{#ifEquals pricingType 'external'}}
      {{#if extName}}
       <li>{{this.extName}}</li>
      {{else}}
       <li>{{this.mockProduct.name}}</li>
      {{/if}}
      {{else}}
      <li>{{this.mockProduct.name}}</li>
      {{/ifEquals}}
     {{/each}}
     </ul>
    </div>
    <div class="modal-footer">
     <input type="button" class="btn btn-default btn-sm revertCloseModal" data-zeros="{{stringify this.zeroValues}}" data-dismiss="modal" value="{{pageLabelMap 'Dialog_No'}}" />
     <input type="button" class="btn btn-default btn-sm closeModal" data-zeros="{{this.zeroValues}}" value="{{pageLabelMap 'Yes'}}" />
    </div>
    </div>
   </div><
   </div>
 </script>


	<script id="XC_MiniCart-AttributeItems" type="text/template">
  <div id="minicart_attribute_items{{itemID}}" class="modal fade cc_modal cc_cart_attribute_items_modal gp_cart_attribute_items_modal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
   <div class="modal-content cc_modal_content">
   <div class="modal-header">
    <button type="button" class="close cc_close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&#215;</span></button>
    {{#ifEquals this.pricingType 'external'}}
    {{#if extName}}
     <h3 id="myModalLabel">{{this.extName}}&#58;&#160;{{pageLabelMap 'Cart_AttributeItems'}}</h3>
    {{else}}
     <h3 id="myModalLabel">{{this.mockProduct.name}}&#58;&#160;{{pageLabelMap 'Cart_AttributeItems'}}</h3>
    {{/if}}
    {{else}}
    <h3 id="myModalLabel">{{this.mockProduct.name}}&#58;&#160;{{pageLabelMap 'Cart_AttributeItems'}}</h3>
    {{/ifEquals}}
   </div>
   <div class="modal-body cc_modal-body">
    <div class="table-responsive">
    <table class="cart_figures table table-striped table-condensed cc_table cc_included_items">
     <thead class="cc_table_header">
     <th class="cc_name">{{pageLabelMap 'CartInc_SKU'}}</th>
     {{#each this.topAttributes}}
      <th class="cc_attribute_name">{{this.displayName}}</th>
     {{/each}}
     <th class="cc_attribute_qty">{{pageLabelMap 'CartInc_AttributeQuantity'}}</th>
     <th class="cc_price">{{pageLabelMap 'CartInc_Price'}}</th>
     <th class="cc_total">{{pageLabelMap 'CartInc_Total'}}</th>
     <th class="cc_remove"></th>
     </thead>
     <tbody>
     {{#each this.minorLines}}
      <tr>
      <td class="text-nowrap">
       {{#if extSKU}}
       {{extSKU}}
       {{else}}
       {{mockProduct.sku}}
       {{/if}}
      </td>
      {{#if primaryAttr}}<td><span class="cc_attr_display">{{primaryAttr.displayName}}</span></td>{{/if}}
      {{#if secondaryAttr}}<td><span class="cc_attr_display">{{secondaryAttr.displayName}}</span></td>{{/if}}
      {{#if tertiaryAttr}}<td><span class="cc_attr_display">{{tertiaryAttr.displayName}}</span></td>{{/if}}
      {{#ifEquals pricingType 'external'}}
       <td><span class="cc_attr_qty"><input id="qtyInput_{{this.itemID}}" type="text" name="qty" class="form-control input-sm input-text entry cc_input_sm" data-id= "{{this.itemID}}" data-parentID="{{this.parentCartItem}}" value="{{this.quantity}}" maxlength="7" autocomplete="off" readonly/></span></td>
      {{else}}
       <td><span class="cc_attr_qty"><input id="qtyInput_{{this.itemID}}" type="text" name="qty" class="form-control input-sm input-text entry cc_input_sm" data-id= "{{this.itemID}}" data-parentID="{{this.parentCartItem}}" value="{{this.quantity}}" maxlength="7" autocomplete="off" /></span></td>
      {{/ifEquals}}
      <td><span class="cc_attr_price">{{price this.price this.currencyCode}}</span></td>
      <td><span class="cc_attr_line_total">{{price this.SubAmount this.currencyCode}}</span></td>
      </tr>
     {{/each}}
     </tbody>
    </table>
    </div>
    <hr>
    <div class="row">
    <div class="col-md-12">
    <span class="pull-right">
     <button class="btn btn-default btn-sm cc_update_cart_button updateCartButton" type="button" >{{pageLabelMap 'MiniCart_Update'}}</button>
    </span>
    </div>
    </div>
    <div class="row">
    <div class="col-md-12">
     <span class="pull-right">{{pageLabelMap 'CartInc_Total'}}&#58;&#160;{{price this.SubAmount}}</span>
    </div>
    </div>
   </div>
   </div>
  </div>
  </div>
 </script>
